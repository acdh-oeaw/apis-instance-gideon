[project]
name = "apis-instance-gideon"
version = "0.1.0"
description = "Some APIS instance"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Birger Schacht", email = "birger.schacht@oeaw.ac.at" }]
license = "MIT"
dependencies = [
   "apis-core-rdf==0.73.1",
   "apis-acdhch-default-settings==2.24.2",
   "psycopg[binary]~=3.0",
   "django-interval>=0.5.1",
   "django-auditlog==3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "djlint>=1.50.0",
    "ruff>=0.17.5",
]

[tool.ruff]
lint.select = ["E4", "E7", "E9", "F", "I"]
lint.ignore = ["E501", "F403"]
lint.isort.known-first-party = ["apis_core"]
